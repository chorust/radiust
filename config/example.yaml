runtime:
  frame_concurrency: 2
  request_concurrency: 16
  host_concurrency: 4
  decode_workers: 2
  request_timeout: 30
  frame_deadline: 300
  max_artifact_bytes: 536870912
  max_frame_bytes: 2147483648
  max_pixels: 100000000
  max_temp_bytes: 10737418240
  allow_network: false

cache:
  dir: ~/.cache/radiust
  max_bytes: 20000000000
  max_age_days: 30
  gc_interval_hours: 24
  enabled: true

sources: {}
  # To configure a source, replace `sources: {}` above with a `sources:` block, e.g.:
  # sources:
  #   tw:
  #     api_key: set-through-your-secret-store  # Required for observation-wide (O-A0058-001).
  #   rdcap:
  #     insecure_tls: true  # Optional: disable verification only for RDCAP HTTPS requests.
  #   provider:
  #     endpoint: https://example.invalid
  #     access_key: set-through-your-secret-store
  #     secret_key: set-through-your-secret-store

# Location-driven local view (optional). Coordinates below are placeholders for
# illustration; use your own. Setting a location does not imply that any source
# passes default admission, and network access still requires runtime.allow_network.
# location:
#   longitude: 121.60
#   latitude: 24.00
# local_view:
#   radius_km: 50
#   resolution_m: 1000

storage:
  output: ./data
  # endpoint: https://objects.example.invalid
  # region: us-east-1
  # access_key: set-through-your-secret-store
  # secret_key: set-through-your-secret-store
  anonymous: false

output:
  format: netcdf
  grid: native
  resampling: nearest
