name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write          # for the catalog-update reminder issue below

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Single source of releases — do NOT cut GitHub Releases or tags by hand.
          # On merge of the release PR, release-please tags the version AND publishes a
          # GitHub Release (with the generated changelog as the body); `extra-files`
          # bumps extension.yml's extension.version in the same PR.
          #
          # Config: release-please-config.json + .release-please-manifest.json (repo root).
          # The manifest is seeded at 0.0.0; the first 0.1.0 release is driven by a
          # `Release-As: 0.1.0` commit footer so release-please itself creates the
          # 0.1.0 tag + GitHub Release (the catalog download_url depends on that release
          # archive existing).
          token: ${{ secrets.GITHUB_TOKEN }}

      # When (and only when) a release is actually cut, open a reminder issue in THIS
      # repo, assigned to the maintainer, to (re-)submit the extension to the spec-kit
      # community catalog. spec-kit has no API for catalog updates — both new
      # submissions and version updates go through a human-filed Extension Submission
      # issue at github/spec-kit (https://github.com/github/spec-kit/issues/new?template=extension_submission.yml),
      # whose checkboxes attest to testing/security. We deliberately do NOT auto-file in
      # github/spec-kit (cross-repo token + unverified attestations + maintainer spam);
      # instead this issue carries the exact, ready-to-paste fields for the human step.
      - name: Open catalog-update reminder issue
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.zip"
          TODAY="$(date -u +%Y-%m-%d)"            # real release date, not a placeholder
          UPDATED_AT="${TODAY}T00:00:00Z"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Submit/update roadmap ${VERSION} in the spec-kit community catalog" \
            --assignee srobroek \
            --label "release,catalog" \
            --body "$(cat <<EOF
          Release **${VERSION}** (\`${TAG}\`, ${TODAY}) is published. spec-kit has no catalog
          API — both new submissions and version updates go through a human-filed
          **Extension Submission** issue (same template; for an update, note in the body that
          it updates the existing \`roadmap\` entry):

          → https://github.com/github/spec-kit/issues/new?template=extension_submission.yml

          Everything below is computed for this release — copy each field into the matching
          template input. The Testing Details / Example Usage / Testing+Submission checkboxes
          are stable across releases; copy those from \`docs/catalog-submission-issue.md\` at
          tag \`${TAG}\`.

          ---

          **Per-field values (copy into the template):**

          - **Extension ID:** \`roadmap\`
          - **Extension Name:** Spec Roadmap
          - **Version:** \`${VERSION}\`
          - **Description:** Capture a durable spec roadmap after the constitution, then review specs against it before and after implementation so spec-specific decisions, outcomes, and constraints are never lost.
          - **Author:** srobroek
          - **Repository URL:** https://github.com/${GITHUB_REPOSITORY}
          - **Download URL:** ${DOWNLOAD_URL}
          - **License:** Apache-2.0
          - **Homepage:** https://github.com/${GITHUB_REPOSITORY}
          - **Documentation URL:** https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md
          - **Changelog URL:** https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md
          - **Required Spec Kit Version:** \`>=0.11.6\`
          - **Number of Commands:** 4
          - **Number of Hooks:** 3
          - **Tags:** roadmap, planning, governance, review, spec-alignment

          ---

          **Proposed Catalog Entry (paste verbatim):**

          \`\`\`json
          {
            "roadmap": {
              "name": "Spec Roadmap",
              "id": "roadmap",
              "description": "Capture a durable spec roadmap after the constitution, then review specs against it before and after implementation so spec-specific decisions, outcomes, and constraints are never lost.",
              "author": "srobroek",
              "version": "${VERSION}",
              "download_url": "${DOWNLOAD_URL}",
              "repository": "https://github.com/${GITHUB_REPOSITORY}",
              "homepage": "https://github.com/${GITHUB_REPOSITORY}",
              "documentation": "https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md",
              "changelog": "https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md",
              "license": "Apache-2.0",
              "requires": { "speckit_version": ">=0.11.6" },
              "provides": { "commands": 4, "hooks": 3 },
              "tags": ["roadmap", "planning", "governance", "review", "spec-alignment"],
              "verified": false,
              "downloads": 0,
              "stars": 0,
              "created_at": "2026-06-24T00:00:00Z",
              "updated_at": "${UPDATED_AT}"
            }
          }
          \`\`\`

          > For an UPDATE, the maintainer preserves the original \`created_at\`, \`downloads\`,
          > and \`stars\`; only \`version\`, \`download_url\`, and \`updated_at\` change.

          Close this issue once the spec-kit submission issue is filed.
          EOF
          )"
