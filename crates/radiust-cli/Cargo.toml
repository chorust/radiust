[package]
name = "radiust-cli"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native command-line interface for radiust"

repository = "https://github.com/chorust/radiust"
homepage = "https://github.com/chorust/radiust"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]

[[bin]]
name = "radiust"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
comfy-table = "7.2"
console = "0.16"
indicatif = "0.18"
radiust-core = { path = "../radiust-core", version = "=0.1.1" }
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
libc.workspace = true
netcdf.workspace = true
sha2.workspace = true
tempfile.workspace = true
