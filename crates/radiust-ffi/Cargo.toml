[package]
name = "radiust-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "In-process C ABI for Radiust Desktop (SwiftUI). No daemon."
license = "Apache-2.0"
publish = false

[lib]
name = "radiust_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
radiust-core = { path = "../radiust-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
